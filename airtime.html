<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>VtuPro - Buy Airtime</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>


<div class="app">


    <aside class="side">

        <a class="brand"
           href="dashboard.html">

            <span class="mark">
                ⚡
            </span>

            <span>
                VtuPro
            </span>

        </a>


        <a href="dashboard.html">
            🏠 Dashboard
        </a>

        <a href="data.html">
            📶 Buy Data
        </a>

        <a class="active"
           href="airtime.html">
            📱 Buy Airtime
        </a>

        <a href="electricity.html">
            ⚡ Pay Electricity
        </a>

        <a href="wallet.html">
            💳 Wallet
        </a>

        <a href="transactions.html">
            🧾 Transactions
        </a>

        <a href="#">
            🎧 Support
        </a>

        <a href="#">
            ⚙️ Settings
        </a>

        <a class="logout"
           href="index.html">
            ↪ Logout
        </a>

    </aside>


    <main class="main">


        <header class="apphead">

            <b>
                Buy Airtime
            </b>

            <div class="avatar">
                J
            </div>

        </header>


        <section class="content">


            <h1>
                Buy Airtime
            </h1>

            <p class="muted">
                Top up your phone instantly.
            </p>


            <br>


            <div class="panel purchase">


                <b>
                    Network
                </b>


                <div class="network">

                    <button
                        class="active"
                        onclick="pick(this)">
                        MTN
                    </button>

                    <button onclick="pick(this)">
                        Airtel
                    </button>

                    <button onclick="pick(this)">
                        Glo
                    </button>

                    <button onclick="pick(this)">
                        9mobile
                    </button>

                </div>


                <div class="field">

                    <label>
                        Phone Number
                    </label>

                    <input
                        class="input"
                        placeholder="Enter 11-digit phone number">

                </div>


                <div class="field">

                    <label>
                        Amount
                    </label>

                    <select
                        class="input"
                        id="airtimeAmount">

                        <option value="">
                            Select amount
                        </option>

                        <option value="100">
                            ₦100
                        </option>

                        <option value="200">
                            ₦200
                        </option>

                        <option value="500">
                            ₦500
                        </option>

                        <option value="1000">
                            ₦1,000
                        </option>

                        <option value="2000">
                            ₦2,000
                        </option>

                    </select>

                </div>


                <button
                    class="btn primary full"
                    onclick="airtime()">

                    Proceed to Pay

                </button>


            </div>


        </section>


    </main>

</div>


<script src="js/app.js"></script>

</body>
</html>
